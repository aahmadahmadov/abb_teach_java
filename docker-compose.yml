services:
    postgres:
        image: postgres:16
        container_name: lesson1-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: lesson1
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d lesson1" ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres-data:
