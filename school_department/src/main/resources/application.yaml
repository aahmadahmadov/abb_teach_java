server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: school-management
  datasource:
    url: jdbc:postgresql://localhost:5432/school_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
