databaseChangeLog:
  - changeSet:
      id: 008-1
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: accounts
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_username
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_email
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: password_changed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 008-2
      author: Ahmad Ahmadov
      changes:
        - sql:
            sql: ALTER TABLE accounts ADD CONSTRAINT chk_accounts_role CHECK (role_id IN (1, 2, 3))
      rollback:
        - sql:
            sql: ALTER TABLE accounts DROP CONSTRAINT chk_accounts_role
