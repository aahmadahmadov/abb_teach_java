databaseChangeLog:
  - changeSet:
      id: 004-1
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: authors
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_authors
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-2
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: books
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books
              - column:
                  name: title
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(8, 2)
                  constraints:
                    nullable: false
              - column:
                  name: page_count
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-3
      author: Ahmad Ahmadov
      changes:
        - sql:
            sql: ALTER TABLE books ADD CONSTRAINT chk_book_price CHECK (price >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE books DROP CONSTRAINT chk_book_price

  - changeSet:
      id: 004-4
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: author_book
      changes:
        - createTable:
            tableName: author_book
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_author_book
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-5
      author: Ahmad Ahmadov
      changes:
        - addUniqueConstraint:
            constraintName: uk_author_book
            tableName: author_book
            columnNames: author_id, book_id

  - changeSet:
      id: 004-6
      author: Ahmad Ahmadov
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_ab_author
            baseTableName: author_book
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id

  - changeSet:
      id: 004-7
      author: Ahmad Ahmadov
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_ab_book
            baseTableName: author_book
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
