databaseChangeLog:
  - changeSet:
      id: 001-1
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_users_email
              - column:
                  name: gender_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-2
      author: Ahmad Ahmadov
      changes:
        - sql:
            sql: ALTER TABLE users ADD CONSTRAINT chk_users_gender CHECK (gender_id IN (1, 2))
      rollback:
        - sql:
            sql: ALTER TABLE users DROP CONSTRAINT chk_users_gender

  - changeSet:
      id: 001-3
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: passports
      changes:
        - createTable:
            tableName: passports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_passports
              - column:
                  name: serial_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_passport_serial_number
              - column:
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_passport_user
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-4
      author: Ahmad Ahmadov
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_passport_user
            baseTableName: passports
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
