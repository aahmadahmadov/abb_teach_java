databaseChangeLog:
  - changeSet:
      id: 002-1
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: departments
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_departments
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_department_name
              - column:
                  name: location
                  type: VARCHAR(100)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-2
      author: Ahmad Ahmadov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employees
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employees
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: salary
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: version_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-3
      author: Ahmad Ahmadov
      changes:
        - sql:
            sql: ALTER TABLE employees ADD CONSTRAINT chk_employee_salary CHECK (salary > 0)
      rollback:
        - sql:
            sql: ALTER TABLE employees DROP CONSTRAINT chk_employee_salary

  - changeSet:
      id: 002-4
      author: Ahmad Ahmadov
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_employee_department
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
